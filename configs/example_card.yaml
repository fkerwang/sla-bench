# H20 Reference Configuration (Default: FP8; for vendor cards copy configs/vendor_card.yaml)
# Run: python3 -m sla_bench run -c configs/example_card.yaml

card: "H20"                      # Real card model (never leave "GPU")
title: "H20 · 不同 TTFT / TPOT 门限下的 QPM/card 与准确率"
results_dir: "results/example_h20_fp8"
report_out: "results/example_h20_fp8/sla_report.html"

slas:
  - {label: "①", ttft_ms: 2005.0, tpot_ms: 51.0, color: "#DC2626"}
  - {label: "②", ttft_ms: 1000.0, tpot_ms: 20.0, color: "#EA580C"}

sweep:
  rounds: 2
  warmup_s: 60.0
  min_s: 180.0
  max_s: 2400.0
  max_tokens: 1000
  len_tol: 0.03
  min_completed: 0
  min_per_round: 32
  stab_z: 3.0
  gap_threshold: 0.10
  min_bracket_rel: 0.025
  max_refine_steps: 6
  arrival: "poisson"
  cap_users: 1024
  spawn_rate: 50.0
  inter_round_cooldown_s: 30.0
  health_check: true
  health_path: "/health_generate"
  acc_prompts: 300
  acc_warmup_s: 60.0
  acc_warm_prompts: 128
  acc_seed: 0

models:
  - key: "moe_tp2_fp8"
    model: "Qwen3.5-35B-A3B-fp8"
    served_model_name: "Qwen3.5-35B-A3B"
    model_short: "35B-A3B MoE"
    tp: 2
    cards: 2                     # Physical cards occupied per replica (QPM/card = rate * 60 / cards)
    color: "#2563EB"
    precision: "FP8"
    backend: "sglang"
    ports: [30100, 30101]
    rates: [0.6, 1.2, 1.8, 2.4, 3.0, 3.6]

  - key: "d27_tp2_fp8"
    model: "Qwen3.8-27B-fp8"
    served_model_name: "Qwen3.8-27B"
    model_short: "27B dense"
    tp: 2
    cards: 2
    color: "#7C3AED"
    precision: "FP8"
    backend: "sglang"
    ports: [30100, 30101]
    rates: [0.10, 0.22, 0.36, 0.52, 0.72, 0.96]

external_baselines: []
